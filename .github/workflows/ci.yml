name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./... -short -count=1

      - name: Unit tests (race detector)
        if: runner.os == 'Linux'
        run: go test ./... -race -short -count=1

  integration:
    name: Integration (${{ matrix.transport }}-${{ matrix.shell }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - transport: docker
            shell: bash
            service: docker-bash
          - transport: docker
            shell: pwsh
            service: docker-pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start test containers
        working-directory: test/integration
        run: docker compose up -d ${{ matrix.service }}

      - name: Wait for container ready
        run: sleep 3

      - name: Run integration tests
        env:
          TRAMP_TEST_DOCKER_CONTAINER: integration-${{ matrix.service }}-1
        run: go test -tags integration -count=1 -v ./test/integration/ -run "Docker"

      - name: Stop containers
        if: always()
        working-directory: test/integration
        run: docker compose down

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi
