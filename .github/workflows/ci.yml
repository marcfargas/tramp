name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./... -short -count=1

      - name: Unit tests (race detector)
        if: runner.os == 'Linux'
        run: go test ./... -race -short -count=1

  plugin:
    name: Plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        run: go build -o .claude-plugin/bin/tramp${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/tramp

      - name: Verify bootstrap runs MCP server
        shell: bash
        run: |
          export CLAUDE_PLUGIN_ROOT="$(pwd)"
          # Write init request to a file, pipe it to the server, capture output
          echo '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"test","version":"1.0"}}}' > /tmp/init.json
          # Run server with stdin from file, kill after 3s
          output=$(.claude-plugin/bin/bootstrap.sh serve < /tmp/init.json &
            PID=$!
            sleep 3
            kill $PID 2>/dev/null || true
            wait $PID 2>/dev/null || true
          )
          # Alternative: just run the binary directly to verify it starts
          .claude-plugin/bin/tramp* serve < /tmp/init.json > /tmp/mcp_output.json &
          PID=$!
          sleep 2
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          cat /tmp/mcp_output.json
          if grep -q '"serverInfo"' /tmp/mcp_output.json; then
            echo "Plugin OK — MCP server responded with serverInfo"
          else
            echo "FAIL: MCP server did not respond to initialize"
            exit 1
          fi

      - name: Verify plugin.json
        shell: bash
        run: |
          if [ ! -f .claude-plugin/plugin.json ]; then
            echo "FAIL: plugin.json missing"
            exit 1
          fi
          # Check required fields
          name=$(jq -r '.name' .claude-plugin/plugin.json)
          version=$(jq -r '.version' .claude-plugin/plugin.json)
          if [ "$name" != "tramp" ] || [ -z "$version" ]; then
            echo "FAIL: plugin.json invalid (name=$name, version=$version)"
            exit 1
          fi
          echo "plugin.json OK (name=$name, version=$version)"

      - name: Verify .mcp.json
        shell: bash
        run: |
          if [ ! -f .claude-plugin/.mcp.json ]; then
            echo "FAIL: .mcp.json missing"
            exit 1
          fi
          cmd=$(jq -r '.mcpServers.tramp.command' .claude-plugin/.mcp.json)
          if [ -z "$cmd" ]; then
            echo "FAIL: .mcp.json has no tramp server command"
            exit 1
          fi
          echo ".mcp.json OK (command=$cmd)"

  integration-docker:
    name: Integration (docker-${{ matrix.shell }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: bash
            service: docker-bash
          - shell: pwsh
            service: docker-pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start test containers
        working-directory: test/integration
        run: docker compose up -d ${{ matrix.service }}

      - name: Wait for container ready
        run: sleep 3

      - name: Run integration tests
        env:
          TRAMP_TEST_DOCKER_CONTAINER: integration-${{ matrix.service }}-1
        run: go test -tags integration -count=1 -v ./test/integration/ -run "Docker"

      - name: Stop containers
        if: always()
        working-directory: test/integration
        run: docker compose down

  integration-ssh:
    name: Integration (ssh-bash)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate SSH key pair
        run: |
          ssh-keygen -t ed25519 -f /tmp/tramp-test-key -N "" -q
          echo "TRAMP_TEST_SSH_KEY=/tmp/tramp-test-key" >> "$GITHUB_ENV"

      - name: Start SSH container
        working-directory: test/integration
        run: |
          export PUBLIC_KEY="$(cat /tmp/tramp-test-key.pub)"
          docker compose up -d ssh-bash

      - name: Wait for SSH ready
        run: |
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -i /tmp/tramp-test-key -p 2222 testuser@localhost echo ok 2>/dev/null; then
              echo "SSH ready"
              exit 0
            fi
            sleep 1
          done
          echo "SSH not ready after 30s"
          exit 1

      - name: Run SSH integration tests
        env:
          TRAMP_TEST_SSH_HOST: testuser@localhost
          TRAMP_TEST_SSH_KEY: /tmp/tramp-test-key
        run: go test -tags integration -count=1 -v ./test/integration/ -run "SSH"

      - name: Stop containers
        if: always()
        working-directory: test/integration
        run: docker compose down

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi
